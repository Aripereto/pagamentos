name: 'Testes Automatizados CI'

on:
  workflow_dispatch:

  push:
    branches:
      - master

  schedule:
    - cron: '0 8 * * 1-5'

jobs:
  
  inspecao:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Instalando Yarn
        run: npm install -g yarn
      - name: Instalando dependências
        run: yarn
      - name: Verificando instalação
        run: echo "Projeto carregado com sucesso"

  unidade:
    runs-on: ubuntu-latest
    needs: [inspecao]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Instalando Yarn
        run: npm install -g yarn
      - name: Instalando dependências
        run: yarn
      - name: Rodando testes unitários
        run: yarn run test
  
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [inspecao]
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Instalando Yarn
        run: npm install -g yarn      
      - name: Instalando dependências
        run: yarn
      - name: Instalando Browsers do Playwright
        run: npx playwright install --with-deps
      - name: Executando testes E2E
        run: yarn run e2e
      - name: Salvando relatórios de testes
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          path: ./playwright-report
          name: Relatório de Testes E2E
                          
  deploy:
    runs-on: ubuntu-latest
    needs: [unidade, e2e-tests]

    steps:
      - name: Simulação de Deploy
        run: echo 'Deploy sendo realizado...'